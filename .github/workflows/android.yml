name: Build Rodent V Android ARM64 - Five NNUE Networks

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android.yml"
      - "*.go"
      - "go.mod"
      - "go.sum"
      - "nets/**"

permissions:
  contents: read

jobs:
  build-five-networks:
    name: Build one Android binary per NNUE network
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build each network separately
        shell: bash
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          nets=(nets/*.bin)
          if [ "${#nets[@]}" -ne 5 ]; then
            echo "Expected exactly 5 .bin network files in nets/, found ${#nets[@]}"
            printf 'Found: %s\n' "${nets[@]:-none}"
            exit 1
          fi
          embedded="nets/rodent_8kb_512pw_multilayer_v8.bin"
          mkdir -p /tmp/rodent-net-inputs
          for net in "${nets[@]}"; do cp "$net" "/tmp/rodent-net-inputs/$(basename "$net")"; done
          for net in /tmp/rodent-net-inputs/*.bin; do
            name="$(basename "$net" .bin)"
            echo "Building with NNUE network: $name"
            cp "$net" "$embedded"
            go build -trimpath -ldflags="-s -w" -o "dist/rodent-v-${name}-android-arm64" .
            test -s "dist/rodent-v-${name}-android-arm64"
            cp "$net" dist/
          done
          (cd dist && zip -q rodent-v-five-net-builds.zip rodent-v-*-android-arm64 *.bin)

      - name: Upload five-network build package
        uses: actions/upload-artifact@v4
        with:
          name: rodent-v-five-networks-android-arm64
          path: dist/rodent-v-five-net-builds.zip
          if-no-files-found: error
